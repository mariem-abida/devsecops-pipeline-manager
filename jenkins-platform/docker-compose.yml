services:

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: devsecops-jenkins:local
    container_name: devsecops-jenkins
    user: root
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - devsecops-network

volumes:
  jenkins_home:

networks:
  devsecops-network:
    external: true