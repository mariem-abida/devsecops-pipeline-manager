services:
  postgres:
    image: postgres:16
    container_name: devsecops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsecops_user
      POSTGRES_PASSWORD: devsecops_password
      POSTGRES_DB: devsecops_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsecops_user -d devsecops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: