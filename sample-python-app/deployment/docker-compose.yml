# DevSecOps Pipeline — Infrastructure as Code
# Docker Compose deployment file — Step 26
#
# Variables are injected via deployment/.env.runtime (generated by Jenkins)
# Never commit .env.runtime — only .env.example is in Git.
#
# Usage (manual):
#   docker compose --env-file deployment/.env.runtime \
#                  -f deployment/docker-compose.yml \
#                  -p <project>-<env> up -d

services:

  application:
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}

    restart: unless-stopped

    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"

    environment:
      APP_ENV: ${APP_ENV}

    labels:
      devsecops.project: "${PROJECT_NAME}"
      devsecops.environment: "${APP_ENV}"
      devsecops.build: "${BUILD_NUMBER}"
